apiVersion: v1
kind: ConfigMap
metadata:
  name: adhoc-project-cm
data:
  project.yaml: |
    - name: test-gitlab-registry-1
      scanType: artifactScan
      platform: gitlab-registry
      accountName: test-gitlabcontainer (UT)
      teamName: UT
      scanLevel: repoLevel
      organisation: dev/test-group/ssd-opa
      type: ''
      projectConfigs:
        - repository: dev/test-group/ssd-opa
          scheduleTime: 0
          tag:
            - latest
          tagPattern: ''
          scanUpto: 0
    - name: test-gitlab-registry-2
      scanType: artifactScan
      platform: gitlab-registry
      accountName: test-gitlabcontainer (UT)
      teamName: UT
      scanLevel: repoLevel
      organisation: dev/sample-project-001
      type: ''
      projectConfigs:
        - repository: dev/sample-project-001
          scheduleTime: 0
          tag:
            - latest
          tagPattern: ''
          scanUpto: 0
          
